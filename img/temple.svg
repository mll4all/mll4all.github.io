<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150"
     preserveAspectRatio="xMidYMax slice" role="img"
     aria-label="Silhouette of a Greek temple with a Doric colonnade">
  <defs>
    <linearGradient id="sky-who" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fffdf8"/>
      <stop offset="55%"  stop-color="#f3efe2"/>
      <stop offset="100%" stop-color="#e7e3d2"/>
    </linearGradient>
    <radialGradient id="haze-who" cx="0.5" cy="0.9" r="0.6">
      <stop offset="0%"   stop-color="#b08d3e" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#b08d3e" stop-opacity="0"/>
    </radialGradient>

    <!-- one Doric column: capital, fluted shaft -->
    <g id="doric">
      <rect x="-3" y="0" width="24" height="6" fill="#1f2a44" fill-opacity="0.32"/>
      <rect x="0"  y="6" width="18" height="36" fill="#1f2a44" fill-opacity="0.30"/>
      <line x1="6"  y1="9" x2="6"  y2="40" stroke="#f7f4ec" stroke-opacity="0.40" stroke-width="1.1"/>
      <line x1="12" y1="9" x2="12" y2="40" stroke="#f7f4ec" stroke-opacity="0.40" stroke-width="1.1"/>
    </g>
  </defs>

  <rect width="600" height="150" fill="url(#sky-who)"/>
  <rect width="600" height="150" fill="url(#haze-who)"/>

  <!-- distant ruins, far background -->
  <g fill="#1f2a44" fill-opacity="0.10">
    <rect x="36"  y="104" width="12" height="34"/>
    <rect x="60"  y="110" width="12" height="28"/>
    <rect x="84"  y="100" width="12" height="38"/>
    <rect x="30"  y="98"  width="72" height="6"/>
    <rect x="512" y="108" width="12" height="30"/>
    <rect x="536" y="102" width="12" height="36"/>
    <rect x="506" y="96"  width="48" height="6"/>
  </g>

  <!-- temple -->
  <g>
    <polygon points="160,74 300,44 440,74" fill="#1f2a44" fill-opacity="0.26"/>
    <rect x="155" y="74" width="290" height="6" fill="#1f2a44" fill-opacity="0.34"/>
    <rect x="163" y="80" width="274" height="8" fill="#1f2a44" fill-opacity="0.30"/>

    <!-- triglyphs along the frieze -->
    <g fill="#f7f4ec" fill-opacity="0.34">
      <rect x="172" y="81" width="4" height="6"/><rect x="206" y="81" width="4" height="6"/>
      <rect x="240" y="81" width="4" height="6"/><rect x="274" y="81" width="4" height="6"/>
      <rect x="308" y="81" width="4" height="6"/><rect x="342" y="81" width="4" height="6"/>
      <rect x="376" y="81" width="4" height="6"/><rect x="410" y="81" width="4" height="6"/>
    </g>

    <use href="#doric" x="172" y="88"/><use href="#doric" x="206" y="88"/>
    <use href="#doric" x="240" y="88"/><use href="#doric" x="274" y="88"/>
    <use href="#doric" x="308" y="88"/><use href="#doric" x="342" y="88"/>
    <use href="#doric" x="376" y="88"/><use href="#doric" x="410" y="88"/>

    <rect x="150" y="130" width="300" height="4" fill="#1f2a44" fill-opacity="0.30"/>
    <rect x="142" y="134" width="316" height="4" fill="#1f2a44" fill-opacity="0.26"/>
  </g>

  <rect x="0" y="138" width="600" height="12" fill="#1f2a44" fill-opacity="0.16"/>
</svg>
