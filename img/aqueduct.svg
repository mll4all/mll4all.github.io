<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150"
     preserveAspectRatio="xMidYMax slice" role="img"
     aria-label="Silhouette of a two-tiered Roman aqueduct">
  <defs>
    <linearGradient id="sky-what" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fffdf8"/>
      <stop offset="55%"  stop-color="#f1efe5"/>
      <stop offset="100%" stop-color="#e4e4d6"/>
    </linearGradient>
    <radialGradient id="haze-what" cx="0.5" cy="0.9" r="0.6">
      <stop offset="0%"   stop-color="#2f6f6b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2f6f6b" stop-opacity="0"/>
    </radialGradient>

    <!-- arch openings are cut out of the masonry -->
    <mask id="arches">
      <rect width="600" height="150" fill="#fff"/>
      <path fill="#000" d="
        M24,136  L24,104  A24,24 0 0 1 72,104  L72,136  Z
        M96,136  L96,104  A24,24 0 0 1 144,104 L144,136 Z
        M168,136 L168,104 A24,24 0 0 1 216,104 L216,136 Z
        M240,136 L240,104 A24,24 0 0 1 288,104 L288,136 Z
        M312,136 L312,104 A24,24 0 0 1 360,104 L360,136 Z
        M384,136 L384,104 A24,24 0 0 1 432,104 L432,136 Z
        M456,136 L456,104 A24,24 0 0 1 504,104 L504,136 Z
        M528,136 L528,104 A24,24 0 0 1 576,104 L576,136 Z"/>
      <path fill="#000" d="
        M16.9,78  L16.9,62  A11,11 0 0 1 38.9,62  L38.9,78  Z
        M55.8,78  L55.8,62  A11,11 0 0 1 77.8,62  L77.8,78  Z
        M94.6,78  L94.6,62  A11,11 0 0 1 116.6,62 L116.6,78 Z
        M133.5,78 L133.5,62 A11,11 0 0 1 155.5,62 L155.5,78 Z
        M172.4,78 L172.4,62 A11,11 0 0 1 194.4,62 L194.4,78 Z
        M211.3,78 L211.3,62 A11,11 0 0 1 233.3,62 L233.3,78 Z
        M250.1,78 L250.1,62 A11,11 0 0 1 272.1,62 L272.1,78 Z
        M289.0,78 L289.0,62 A11,11 0 0 1 311.0,62 L311.0,78 Z
        M327.9,78 L327.9,62 A11,11 0 0 1 349.9,62 L349.9,78 Z
        M366.8,78 L366.8,62 A11,11 0 0 1 388.8,62 L388.8,78 Z
        M405.6,78 L405.6,62 A11,11 0 0 1 427.6,62 L427.6,78 Z
        M444.5,78 L444.5,62 A11,11 0 0 1 466.5,62 L466.5,78 Z
        M483.4,78 L483.4,62 A11,11 0 0 1 505.4,62 L505.4,78 Z
        M522.3,78 L522.3,62 A11,11 0 0 1 544.3,62 L544.3,78 Z
        M561.1,78 L561.1,62 A11,11 0 0 1 583.1,62 L583.1,78 Z"/>
    </mask>
  </defs>

  <rect width="600" height="150" fill="url(#sky-what)"/>
  <rect width="600" height="150" fill="url(#haze-what)"/>

  <!-- distant hills -->
  <path d="M0,132 Q90,112 180,126 Q260,138 340,122 Q430,106 520,124 Q560,132 600,128 L600,150 L0,150 Z"
        fill="#1f2a44" fill-opacity="0.09"/>

  <g mask="url(#arches)">
    <rect x="0" y="80" width="600" height="56" fill="#1f2a44" fill-opacity="0.30"/>
    <rect x="0" y="50" width="600" height="30" fill="#1f2a44" fill-opacity="0.26"/>
  </g>

  <!-- cornice courses -->
  <rect x="0" y="44" width="600" height="6" fill="#1f2a44" fill-opacity="0.32"/>
  <rect x="0" y="74" width="600" height="6" fill="#1f2a44" fill-opacity="0.32"/>

  <rect x="0" y="136" width="600" height="14" fill="#1f2a44" fill-opacity="0.16"/>
</svg>
